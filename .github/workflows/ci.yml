name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: pipx install uv || pip install uv
      - run: uv venv --python 3.13 .venv && uv pip install --python .venv/bin/python -e ".[dev,ingest,cv,geo,exportlibs,s3]"
      - run: .venv/bin/ruff check .
      - run: .venv/bin/mypy core ingestion takeoff classification provenance review boq catalog pricing exports backend

  architecture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: pipx install uv || pip install uv
      - run: uv venv --python 3.13 .venv && uv pip install --python .venv/bin/python -e ".[dev,ingest,cv,geo,exportlibs,s3]"
      - name: import-linter boundary check
        run: .venv/bin/lint-imports
      - name: reference-leak guard
        run: .venv/bin/python tools/guards/reference_leak.py

  tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: boq
          POSTGRES_PASSWORD: boq
          POSTGRES_DB: boq_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U boq"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 20
    env:
      DATABASE_URL: postgresql+asyncpg://boq:boq@localhost:5432/boq_test
      JWT_SECRET: ci-secret
      S3_TEST_ENDPOINT: http://localhost:9000
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: pipx install uv || pip install uv
      - run: uv venv --python 3.13 .venv && uv pip install --python .venv/bin/python -e ".[dev,ingest,cv,geo,exportlibs,s3]"
      - name: migrations
        run: .venv/bin/alembic -c backend/alembic.ini upgrade head
      # Live S3 endpoint for the S3Storage adapter tests (T128): backend/
      # tests/test_s3_storage.py is gated on S3_TEST_ENDPOINT pointing here.
      # Not a `services:` entry: MinIO is GONE from Docker Hub (minio/minio
      # answers "repository does not exist") and lives on quay.io now, whose
      # image default-cmd prints help — GH service containers cannot override
      # the command, so the server is started with an explicit `docker run`
      # like the e2e job starts uvicorn/vite.
      - name: start minio (S3 endpoint, quay.io)
        run: |
          docker run -d --name minio -p 9000:9000 \
            -e MINIO_ROOT_USER=boq -e MINIO_ROOT_PASSWORD=boqboq123 \
            quay.io/minio/minio server /data
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:9000/minio/health/live || true)
            if [ "$code" = "200" ]; then echo "minio up (attempt $i)"; exit 0; fi
            sleep 2
          done
          echo "minio did not come up:"; docker logs minio; exit 1
      - name: unit + integration tests
        run: .venv/bin/pytest core/tests backend/tests tests -m "not perf" -q

  perf:
    # T125: §G performance benchmarks — the same measured gates as local
    # (BOQ_PERF=1 .venv/bin/pytest tests/perf -m perf -q), never a reduced
    # assertion. Fixtures are GENERATED at test time (deterministic, seeded),
    # so no large binaries ship in the repo. Deselected from the normal
    # `tests` matrix via -m "not perf"; this job is the only place they run.
    # timeout-minutes: generous but real — local run is ~2 min; the ceiling
    # exists so a hung benchmark fails loudly instead of burning the default
    # 6h job budget.
    timeout-minutes: 30
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: boq
          POSTGRES_PASSWORD: boq
          POSTGRES_DB: boq_perf
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U boq"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 20
    env:
      DATABASE_URL: postgresql+asyncpg://boq:boq@localhost:5432/boq_perf
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: pipx install uv || pip install uv
      - run: uv venv --python 3.13 .venv && uv pip install --python .venv/bin/python -e ".[dev,ingest,cv,geo,exportlibs,s3]"
      - name: migrations
        run: .venv/bin/alembic -c backend/alembic.ini upgrade head
      - name: "performance benchmarks (§G: DXF 50k < 60s, PDF 100p < 300s, recompute 5k < 2s, xlsx 5k < 10s)"
        run: BOQ_PERF=1 .venv/bin/pytest tests/perf -m perf -q -s

  license-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: pipx install uv || pip install uv
      - run: uv venv --python 3.13 .venv && uv pip install --python .venv/bin/python -e ".[dev,ingest,cv,geo,exportlibs,s3]"
      - name: pip-audit (vulnerabilities)
        run: .venv/bin/pip-audit --skip-editable
      - name: banned-license check (AGPL must never enter the tree)
        run: |
          .venv/bin/pip list --format=json | .venv/bin/python -c '
          import json,sys
          banned = {"PyMuPDF"}
          pkgs = {p["name"] for p in json.load(sys.stdin)}
          hit = banned & pkgs
          if hit:
              print(f"BANNED PACKAGES PRESENT: {hit}"); sys.exit(1)
          print("license check: clean")'

  docker:
    # T128: the backend image must always build (build-only in PRs — the
    # registry push lives in publish). Independent of every other job.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: build backend image
        run: docker build -t boq-v2-api:ci .

  publish:
    # T128: push the image to GHCR (ghcr.io/Ranjan-111/boq-v2) on main pushes.
    # Zero new secrets: logs in with the workflow's own GITHUB_TOKEN, which
    # gets packages:write through the permissions block below. PRs build
    # only (docker job) — the push runs on the protected branch.
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      - name: log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
      - name: build and push
        run: |
          IMAGE=ghcr.io/${{ github.repository_owner }}/${{ github.event.repository.name }}
          # lowercase-or-nothing: GHCR rejects uppercase repo names
          IMAGE=$(echo "$IMAGE" | tr '[:upper:]' '[:lower:]')
          docker build -t "$IMAGE:main" -t "$IMAGE:${GITHUB_SHA::7}" .
          docker push "$IMAGE:main"
          docker push "$IMAGE:${GITHUB_SHA::7}"

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - working-directory: frontend
        run: |
          if [ -f package.json ]; then
            npm ci && npm run build
          else
            echo "frontend not scaffolded yet — skip"
          fi

  e2e:
    # T126: the full gated-journey browser E2E against a REAL backend —
    # same spec as local (`make e2e`), no reduced assertions. Composition:
    # Postgres service -> migrations -> uvicorn :8099 + worker (background)
    # -> vite dev :5173 (proxies /api to :8099) -> playwright chromium.
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: boq
          POSTGRES_PASSWORD: boq
          POSTGRES_DB: boq_e2e
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U boq"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 20
    env:
      DATABASE_URL: postgresql+asyncpg://boq:boq@localhost:5432/boq_e2e
      JWT_SECRET: ci-e2e-secret-that-is-long-enough
      STORAGE_LOCAL_DIR: /tmp/boq-e2e-storage
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - run: pipx install uv || pip install uv
      - run: uv venv --python 3.13 .venv && uv pip install --python .venv/bin/python -e ".[dev,ingest,cv,geo,exportlibs,s3]"
      - name: migrations
        run: .venv/bin/alembic -c backend/alembic.ini upgrade head
      - name: install playwright chromium
        run: |
          cd frontend && npm ci
          npx playwright install --with-deps chromium
      - name: start backend (api :8099 + worker)
        run: |
          nohup .venv/bin/uvicorn backend.app.main:app --port 8099 > /tmp/api.log 2>&1 &
          nohup .venv/bin/python -m backend.app.jobs.worker > /tmp/worker.log 2>&1 &
          # Wait for the API to answer (401 on /auth/me means alive).
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8099/api/v1/auth/me || true)
            if [ "$code" = "401" ]; then echo "api up (attempt $i)"; exit 0; fi
            sleep 2
          done
          echo "API did not come up:"; cat /tmp/api.log; exit 1
      - name: start vite dev (:5173, proxies /api -> :8099)
        run: |
          cd frontend
          nohup npm run dev -- --port 5173 --strictPort > /tmp/vite.log 2>&1 &
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:5173/ || true)
            if [ "$code" = "200" ]; then echo "vite up (attempt $i)"; exit 0; fi
            sleep 2
          done
          echo "vite did not come up:"; cat /tmp/vite.log; exit 1
      - name: playwright e2e
        run: cd frontend && npx playwright test
      - name: dump service logs on failure
        if: failure()
        run: |
          echo '=== api.log ==='; tail -n 100 /tmp/api.log || true
          echo '=== worker.log ==='; tail -n 100 /tmp/worker.log || true
          echo '=== vite.log ==='; tail -n 100 /tmp/vite.log || true
