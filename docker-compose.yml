services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: boq
      POSTGRES_PASSWORD: boq
      POSTGRES_DB: boq
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U boq"]
      interval: 3s
      timeout: 3s
      retries: 20

  minio:
    # MinIO left Docker Hub — it now publishes exclusively on quay.io
    # (minio/minio there is a deleted repo; the pull would 404).
    image: quay.io/minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: boq
      MINIO_ROOT_PASSWORD: boqboq123
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data

volumes:
  pgdata:
  miniodata:
