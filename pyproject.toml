[project]
name = "boq-v2"
version = "0.1.0"
description = "AI-native construction takeoff and bill of quantities"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "email-validator>=2.2",
    "sqlalchemy[asyncio]>=2.0.36",
    "alembic>=1.14",
    "asyncpg>=0.30",
    "httpx>=0.27",
    "pyjwt>=2.10",
    "bcrypt>=4.2",
    "structlog>=24.4",
    "python-multipart>=0.0.17",
]

[project.optional-dependencies]
ingest = [
    "ezdxf>=1.3",
    "pdfplumber>=0.11",
    "pypdf>=5.0",
    "pypdfium2>=4.30",
    "Pillow>=11.0",
]
cv = [
    "opencv-python-headless>=4.10",
]
geo = [
    "shapely>=2.0",
    "types-shapely>=1.0",
]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "hypothesis>=6.115",
    "ruff>=0.7",
    "mypy>=1.13",
    "import-linter>=2.1",
    "pip-audit>=2.7",
    "greenlet>=3.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["core", "ingestion", "takeoff", "classification", "provenance", "review", "boq", "catalog", "pricing", "exports", "backend"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q --strict-markers"
markers = [
    "unit: fast, no I/O",
    "integration: needs Postgres",
    "migration: Alembic migration tests",
    "guard: architecture/license/reference-leak guards",
]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["."]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S", "ASYNC", "RUF"]
ignore = ["S101"]  # assert is fine in this codebase style

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "ASYNC"]
"backend/app/migrations/**" = ["E501"]
# B008: Depends() in defaults is the FastAPI idiom
"backend/app/api/**" = ["B008"]

[tool.mypy]
python_version = "3.13"
strict = true
warn_unreachable = true
# UUID columns return str at runtime; treat as str in models layer for now
warn_return_any = false
exclude = ["reference/"]

[[tool.mypy.overrides]]
module = ["alembic.*", "alembic"]
ignore_missing_imports = true

[tool.importlinter]
root_packages = ["core", "ingestion", "takeoff", "classification", "provenance", "review", "boq", "catalog", "pricing", "exports", "backend"]
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Core imports no third-party packages"
type = "forbidden"
source_modules = ["core"]
forbidden_modules = ["sqlalchemy", "fastapi", "pydantic", "ezdxf", "shapely", "structlog", "jwt", "bcrypt", "alembic", "uvicorn", "httpx", "pytest"]

[[tool.importlinter.contracts]]
name = "Core subpackages are mutually independent"
type = "independence"
modules = ["core"]
include_external_dependencies = false

[[tool.importlinter.contracts]]
name = "Takeoff determinism boundary"
type = "layers"
layers = ["takeoff", "core"]

[[tool.importlinter.contracts]]
name = "Ingestion determinism boundary"
type = "layers"
layers = ["ingestion", "core"]

[[tool.importlinter.contracts]]
name = "AI boundary (classification never reaches engines)"
type = "layers"
layers = ["classification", "core"]

[[tool.importlinter.contracts]]
name = "Domain service layering"
type = "layers"
layers = ["backend", "pricing | boq | catalog | review | provenance | exports", "core"]

[[tool.importlinter.contracts]]
name = "Forbidden AI-to-measurement imports"
type = "forbidden"
source_modules = ["classification"]
forbidden_modules = ["takeoff", "ingestion", "boq", "pricing"]

[[tool.importlinter.contracts]]
name = "BOQ never reaches takeoff (Protocol boundary)"
type = "forbidden"
source_modules = ["boq"]
forbidden_modules = ["takeoff", "ingestion", "backend"]

[[tool.importlinter.contracts]]
name = "Exports never reach engines (Protocol boundary)"
type = "forbidden"
source_modules = ["exports"]
forbidden_modules = ["takeoff", "ingestion", "backend"]
