# Production composition — T128 first slice. See docs/deploy.md for the
# smoke-test walkthrough, the env var table, and what remains open.
#
# Security rules enforced by this file:
# - NO hardcoded secrets: every credential comes from ${VAR} substitution
#   (shell or .env). Required secrets use the ${VAR:?error} form — compose
#   refuses to start when they are missing, so the dev JWT default can never
#   reach a prod container.
# - Storage is S3/MinIO (STORAGE_BACKEND=s3) with presigned URLs — never a
#   public bucket, never web-root.
# - The image runs as a non-root user (Dockerfile) and migrations are
#   Alembic-only (api runs `upgrade head` before serving).
#
# The FRONTEND is not composed here: it builds separately (vite) and is
# served by any static host / CDN in front of the API.
name: boqv2-prod

x-backend-env: &backend-env
  ENV: ${ENV:-prod}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  # Container-internal URL: the `postgres` service hostname replaces localhost.
  DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-boq}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-boq}
  JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env (min 8 chars, generate e.g. via openssl rand -hex 32)}
  STORAGE_BACKEND: ${STORAGE_BACKEND:-s3}
  STORAGE_LOCAL_DIR: ${STORAGE_LOCAL_DIR:-./data/uploads}
  S3_ENDPOINT: ${S3_ENDPOINT:-http://minio:9000}
  S3_BUCKET: ${S3_BUCKET:-boq-v2}
  # Dedicated least-privilege app credentials (T128): the API/worker talk to
  # MinIO through a policy-limited user that can only act on the app bucket —
  # never the root credentials. Created by minio-init; rotate by changing
  # MINIO_APP_PASSWORD and re-running (user add is idempotent, overwrites).
  S3_ACCESS_KEY: ${MINIO_APP_USER:-boq-app}
  S3_SECRET_KEY: ${MINIO_APP_PASSWORD:?set MINIO_APP_PASSWORD in .env (the least-privilege app user's key)}
  AI_PROVIDER: ${AI_PROVIDER:-stub}
  AI_BASE_URL: ${AI_BASE_URL:-}
  AI_API_KEY: ${AI_API_KEY:-}
  AI_MODEL: ${AI_MODEL:-advisory-default}
  AI_TIMEOUT_SECONDS: ${AI_TIMEOUT_SECONDS:-30.0}

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-boq}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-boq}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-boq}"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  minio:
    # MinIO publishes exclusively on quay.io — the old Docker Hub
    # minio/minio repo is GONE (pulls answer "repository does not exist").
    image: quay.io/minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-boq}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in .env}
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9000/minio/health/live || exit 1"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  minio-init:
    # One-shot: create the app bucket AND the least-privilege app user.
    # MinIO never auto-creates buckets on S3 API calls — without this, the
    # first put() answers NoSuchBucket. Every command is idempotent (verified
    # against live MinIO): user add overwrites in place, policy create
    # overwrites, policy attach re-attaches cleanly — safe on every boot.
    # The policy grants ONLY the app-bucket object actions the Storage port
    # uses (put/get/head/delete/presign) — no bucket admin, no other
    # resources, never root.
    image: quay.io/minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-boq}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in .env}
      MINIO_APP_USER: ${MINIO_APP_USER:-boq-app}
      MINIO_APP_PASSWORD: ${MINIO_APP_PASSWORD:?set MINIO_APP_PASSWORD in .env}
      S3_BUCKET: ${S3_BUCKET:-boq-v2}
    entrypoint: >
      /bin/sh -c "mc alias set boq http://minio:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD
      && mc mb --ignore-existing boq/$$S3_BUCKET
      && printf '%s' '{\"Version\":\"2012-10-17\",\"Statement\":[{\"Effect\":\"Allow\",\"Action\":[\"s3:PutObject\",\"s3:GetObject\",\"s3:DeleteObject\"],\"Resource\":[\"arn:aws:s3:::'\"$$S3_BUCKET\"'/*\"]}]}' > /tmp/app-policy.json
      && mc admin user add boq $$MINIO_APP_USER $$MINIO_APP_PASSWORD
      && mc admin policy create boq boq-app-rw /tmp/app-policy.json
      && mc admin policy attach boq boq-app-rw --user $$MINIO_APP_USER"
    restart: "no"

  api:
    build: .
    image: boq-v2-api:local
    environment: *backend-env
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    ports:
      - "${API_PORT:-8000}:8000"
    restart: unless-stopped

  worker:
    # Same image as api; only the command differs (canonical module path —
    # running the file directly registers handlers into the wrong module).
    build: .
    image: boq-v2-api:local
    command: ["python", "-m", "backend.app.jobs.worker"]
    environment: *backend-env
    # The image HEALTHCHECK probes :8000/healthz — the API's liveness route.
    # The worker deliberately serves NO HTTP port, so that probe would mark
    # it unhealthy forever (an R8 latent defect caught by the R9 smoke test:
    # the worker parsed its job fine while compose showed "unhealthy").
    # Honest worker liveness = the process itself.
    healthcheck:
      disable: true
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      # healthz answering means the api already ran Alembic migrations.
      api:
        condition: service_healthy
    restart: unless-stopped

  caddy:
    # OPTIONAL reverse proxy (compose profiles `proxy` or `tls` — not started
    # by default). Two Caddyfiles ship side by side; the one served is chosen
    # by CADDY_CONFIG (container env, default http):
    #   http — :80 plain reverse proxy, for local smoke tests (profile proxy)
    #   tls  — PUBLIC_DOMAIN with Caddy AUTOMATIC TLS (ACME/Let's Encrypt),
    #          HTTP→HTTPS redirect, HSTS + hardening headers (profile tls).
    # Needs DNS on the domain + ports 80/443 reachable; ACME cannot issue
    # for localhost, so `tls` is a real-server profile — smoke-test `http`.
    image: caddy:2
    profiles: ["proxy", "tls"]
    environment:
      # Rendered host-side; the guard below reads the container value.
      PUBLIC_DOMAIN: ${PUBLIC_DOMAIN:-}
    # Fail fast: selecting Caddyfile.tls without a PUBLIC_DOMAIN would make
    # Caddy request a certificate for the literal fallback host and fail
    # confusingly deep in ACME — refuse loudly at startup instead.
    entrypoint: >
      /bin/sh -c 'cfg=$${CADDY_CONFIG:-http};
      if [ "$$cfg" = "tls" ] && [ -z "$$PUBLIC_DOMAIN" ];
      then echo "PUBLIC_DOMAIN is required when CADDY_CONFIG=tls (set it in .env)"; exit 1; fi;
      exec caddy run --config /etc/caddy/Caddyfile.$$cfg'
    ports:
      - "${CADDY_HTTP_PORT:-80}:80"
      - "${CADDY_HTTPS_PORT:-443}:443"
    depends_on:
      api:
        condition: service_healthy
    configs:
      - source: caddyfile_http
        target: /etc/caddy/Caddyfile.http
      - source: caddyfile_tls
        target: /etc/caddy/Caddyfile.tls
    restart: unless-stopped

configs:
  # Plain-HTTP smoke-test proxy (default). No domain needed.
  caddyfile_http:
    content: |
      :80 {
        reverse_proxy api:8000
      }
  # Automatic-TLS site for a real deployment. The ${PUBLIC_DOMAIN:-localhost}
  # default keeps compose config-rendering working without the domain set
  # (this file simply isn't the one being served in that case — CADDY_CONFIG
  # picks); when CADDY_CONFIG=tls, the guard above requires the domain.
  caddyfile_tls:
    content: |
      ${PUBLIC_DOMAIN:-localhost} {
        reverse_proxy api:8000
        header {
          Strict-Transport-Security "max-age=31536000"
          X-Content-Type-Options nosniff
          Referrer-Policy no-referrer
        }
      }

volumes:
  pgdata:
  miniodata:
